<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Sorielle Cosmetics</title>
    <meta name="description" content="Complete your purchase and glow with Sorielle.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page { padding-top: 100px; padding-bottom: 80px; background: #fafafa; min-height: 100vh; }
        .checkout-container { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        
        .checkout-main, .checkout-sidebar { display: flex; flex-direction: column; gap: 24px; }
        
        .checkout-section { background: var(--white); padding: 32px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .section-title { font-size: 1.25rem; margin-bottom: 24px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
        
        /* Cart Items */
        .checkout-cart-items { display: flex; flex-direction: column; gap: 20px; }
        .checkout-item { display: flex; gap: 20px; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .checkout-item:last-child { border-bottom: none; padding-bottom: 0; }
        .checkout-item-img { width: 80px; height: 80px; border-radius: 16px; background: var(--ivory); overflow: hidden; flex-shrink: 0; }
        .checkout-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .checkout-item-info { flex: 1; }
        .checkout-item-name { font-weight: 500; margin-bottom: 4px; }
        .checkout-item-shade { font-size: 0.8rem; opacity: 0.6; margin-bottom: 8px; }
        .checkout-item-price { color: var(--rose-gold); font-weight: 600; }
        
        .checkout-qty { display: flex; align-items: center; gap: 12px; }
        
        /* Payment Options */
        .payment-options { display: flex; flex-direction: column; gap: 16px; }
        .payment-option {
            border: 2px solid var(--ivory);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-option.active { border-color: var(--rose-gold); background: rgba(183, 110, 121, 0.05); }
        .payment-option i { font-size: 1.5rem; color: var(--rose-gold); }
        .payment-option-text { font-weight: 500; }
        
        /* Sidebar */
        .coupon-box { display: flex; gap: 12px; }
        .coupon-box input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: var(--ivory); font-family: inherit; }
        .apply-btn { padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 0.95rem; }
        .summary-row.total { border-top: 1px solid rgba(0,0,0,0.1); padding-top: 16px; margin-top: 16px; font-size: 1.25rem; font-weight: 600; }
        
        .proceed-btn { width: 100%; padding: 20px; font-size: 1.1rem; border-radius: 16px; }
        
        @media (max-width: 992px) {
            .checkout-container { grid-template-columns: 1fr; }
            .checkout-sidebar { order: -1; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html">Sorielle</a></div>
            <a href="index.html" class="icon-btn"><i class="ph-light ph-arrow-left"></i> Back to Shop</a>
        </div>
    </header>

    <main class="checkout-page">
        <div class="container">
            <div class="checkout-container">
                <!-- Main Content -->
                <div class="checkout-main">
                    <section class="checkout-section">
                        <h2 class="section-title"><i class="ph-fill ph-shopping-cart"></i> Review Items</h2>
                        <div class="checkout-cart-items" id="checkout-items-list">
                            <!-- Injected by JS -->
                        </div>
                    </section>

                    <section class="checkout-section">
                        <h2 class="section-title"><i class="ph-fill ph-credit-card"></i> Payment Method</h2>
                        <div class="payment-options">
                            <div class="payment-option active" data-method="upi">
                                <i class="ph-fill ph-qr-code"></i>
                                <span class="payment-option-text">UPI (Google Pay, PhonePe, Paytm)</span>
                            </div>
                            <div class="payment-option" data-method="card">
                                <i class="ph-fill ph-credit-card"></i>
                                <span class="payment-option-text">Debit / Credit Card</span>
                            </div>
                            <div class="payment-option" data-method="cod">
                                <i class="ph-fill ph-truck"></i>
                                <span class="payment-option-text">Cash on Delivery</span>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Sidebar Summary -->
                <div class="checkout-sidebar">
                    <section class="checkout-section">
                        <h2 class="section-title">Order Summary</h2>
                        
                        <div class="summary-details">
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span id="summary-subtotal">₹0.00</span>
                            </div>
                            <div class="summary-row" style="color: #4CAF50;">
                                <span>Discount</span>
                                <span id="summary-discount">-₹0.00</span>
                            </div>
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span id="summary-shipping">FREE</span>
                            </div>
                            
                            <div class="coupon-section" style="margin: 24px 0;">
                                <div class="coupon-box">
                                    <input type="text" placeholder="Enter coupon code" id="coupon-input">
                                    <button class="btn btn-primary apply-btn">Apply</button>
                                </div>
                            </div>
                            
                            <div class="summary-row total">
                                <span>Total Amount</span>
                                <span id="summary-total" style="color: var(--rose-gold);">₹0.00</span>
                            </div>
                        </div>

                        <button class="btn btn-primary proceed-btn" id="final-checkout-btn" style="margin-top: 32px;">Proceed to Payment</button>
                        
                        <p style="text-align: center; font-size: 0.8rem; opacity: 0.5; margin-top: 20px;">
                            <i class="ph-fill ph-shield-check"></i> Secure SSL Checkout
                        </p>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-content">
            <div class="checkmark-wrapper">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="success-title">Order Received!</h2>
            <p class="success-desc">Connecting to payment gateway...</p>
        </div>
    </div>

    <script type="module">
        import { getCart, getCartTotal, removeFromCart, updateQuantity, clearCart } from './cart.js';

        const renderCheckout = () => {
            const cart = getCart();
            const listContainer = document.getElementById('checkout-items-list');
            listContainer.innerHTML = '';

            if (cart.length === 0) {
                window.location.href = 'index.html';
                return;
            }

            cart.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'checkout-item';
                itemEl.innerHTML = `
                    <div class="checkout-item-img"><img src="${item.image}" alt="${item.name}"></div>
                    <div class="checkout-item-info">
                        <h4 class="checkout-item-name">${item.name}</h4>
                        <p class="checkout-item-shade">${item.shade || ''}</p>
                        <p class="checkout-item-price">${item.price}</p>
                    </div>
                    <div class="checkout-qty">
                        <button class="qty-btn" onclick="updateAndRender(${index}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="updateAndRender(${index}, 1)">+</button>
                    </div>
                `;
                listContainer.appendChild(itemEl);
            });

            const total = getCartTotal();
            document.getElementById('summary-subtotal').innerText = `₹${total.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${total.toFixed(2)}`;
        };

        window.updateAndRender = (index, delta) => {
            updateQuantity(index, delta);
            renderCheckout();
        };

        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
            });
        });

        document.getElementById('final-checkout-btn').addEventListener('click', () => {
            const successOverlay = document.getElementById('success-overlay');
            successOverlay.classList.add('active');
            
            const method = document.querySelector('.payment-option.active').dataset.method;
            const cart = getCart();
            const total = getCartTotal();
            
            // Redirect to WhatsApp with order details after animation
            setTimeout(() => {
                let itemsList = cart.map(item => `- ${item.name} x${item.quantity}`).join('\n');
                const message = `*Order from Website*\n\n*Items:*\n${itemsList}\n\n*Total:* ₹${total.toFixed(2)}\n*Payment Method:* ${method.toUpperCase()}`;
                const encodedMessage = encodeURIComponent(message);
                window.location.href = `https://wa.me/919423646946?text=${encodedMessage}`;
                clearCart();
            }, 2500);
        });

        renderCheckout();
    </script>
</body>
</html>
